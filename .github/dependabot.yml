# SPDX-License-Identifier: RPL-1.5
# Security and version updates as pull requests (OpenSSF Scorecard "Dependency-Update-Tool"): the actions are
# pinned by SHA and the lock files are exact, so nothing moves unless one of these PRs is reviewed and merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

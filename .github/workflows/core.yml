# SPDX-License-Identifier: RPL-1.5
# GDM download core (G5) + bridge. The Tauri app, UI and extension are in app.yml. Actions pinned by SHA; read-only token.
name: core
on:
  push:
  pull_request:
  schedule:
    - cron: "0 18 * * *" # nightly: 1000 TerminateProcess cycles (E-04)
    - cron: "0 20 * * 0" # weekly: N-01 fuzz campaign
  workflow_dispatch:
permissions: read-all
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: toolchain
        run: rustup toolchain install $env:RUST_VERSION --profile minimal -c clippy,rustfmt; rustup default $env:RUST_VERSION
      - name: no TLS bypass anywhere (W-03)
        shell: bash
        run: "! grep -rn --include=*.rs -e danger_accept_invalid -e NoCertificateVerification -e webpki_roots crates fixtures src-tauri"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude galaxy-download-manager --all-targets --locked -- -D warnings
      - name: cargo-deny (licences, advisories, sources)
        run: cargo install cargo-deny --version 0.20.2 --locked; cargo deny --config deny.toml check; cargo install cargo-audit --version 0.22.2 --locked; cargo audit
      - name: exFAT volume + SMB share for the N-09 matrix (hosted runners are admin)
        shell: pwsh
        run: |
          $vhd = "$env:RUNNER_TEMP\fat.vhdx"
          @("create vdisk file=`"$vhd`" maximum=256 type=expandable", "select vdisk file=`"$vhd`"", "attach vdisk",
            "create partition primary", "format fs=exfat quick label=GDMFAT", "assign letter=X") | Set-Content "$env:RUNNER_TEMP\dp.txt"
          diskpart /s "$env:RUNNER_TEMP\dp.txt"
          New-Item -ItemType Directory X:\dl | Out-Null
          New-Item -ItemType Directory "$env:RUNNER_TEMP\share" | Out-Null
          New-SmbShare -Name gdmtest -Path "$env:RUNNER_TEMP\share" -FullAccess "$env:USERDOMAIN\$env:USERNAME" | Out-Null
          "GDM_TEST_FAT_DIR=X:\dl" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "GDM_TEST_SMB_DIR=\\localhost\gdmtest" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: tests (cards E-01..E-04, N-01..N-05, N-09, W-01..W-03, D-01, L-01; hostile fixture wire tests)
        run: cargo test --workspace --exclude galaxy-download-manager --locked --no-fail-fast -- --nocapture
        env:
          GDM_NET_TESTS: "1"

  # P4 (every OS/CPU): the core, the browser bridge and the app on real macOS and Linux machines, x64 and ARM64.
  # Until this job is green on a runner, nothing outside Windows counts as working (decisions 2026-11-13 P4).
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy; rustup default "$RUST_VERSION"
      - name: Linux build libraries (WebKitGTK 4.1, tray, D-Bus)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev gnome-keyring dbus-x11
      - name: bridge sidecar for the Tauri build script + the frontend it embeds
        run: |
          cargo build -p gdm-bridge --locked
          mkdir -p src-tauri/binaries dist
          cp target/debug/gdm-bridge "src-tauri/binaries/gdm-bridge-$(rustc -vV | sed -n 's/^host: //p')"
          [ -f dist/index.html ] || echo '<!doctype html>' > dist/index.html
          mkdir -p extension/dist/chrome; [ -f extension/dist/chrome/manifest.json ] || echo '{}' > extension/dist/chrome/manifest.json # bundled resource (Windows unpacked install)
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: "tests (fsx_unix O_NOFOLLOW, hard links, flock Busy, quarantine/origin mark; bridge socket peer check B-02; E/N/W cards)"
        # Linux: site logins live in the Secret Service (keyring; GDM never stores them in plain text), which a
        # runner does not have: an unlocked gnome-keyring on a private D-Bus session stands in for the desktop's.
        # The password must not be empty: with an empty one no "login" keyring is made, so there is no default
        # collection and every login fails "Secret Service: no result found" (third CI run).
        run: |
          t="cargo test -p gdm-core -p gdm-auth -p gdm-media -p gdm-fixture -p gdm-bridge -p galaxy-download-manager --locked --no-fail-fast"
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- sh -c "printf 'gdm-ci' | gnome-keyring-daemon --unlock --components=secrets >/dev/null && $t"
          else
            $t
          fi

  kill1000:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 18 * * *')
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install $env:RUST_VERSION --profile minimal; rustup default $env:RUST_VERSION
      - name: 1000 TerminateProcess cycles, 0 corrupt files (E-04)
        run: cargo test --release --locked -p gdm-core --test e04_kill -- --nocapture
        env:
          GDM_KILL_ROUNDS: "1000"

  fuzz:
    # N-01 asks for 24 h weekly; a hosted job stops at 6 h, so 5.5 h here (24 h needs a self-hosted runner)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 20 * * 0')
    runs-on: windows-2025
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal; cargo install cargo-fuzz --version 0.13.1 --locked
      - name: fuzz the filename sanitizer and the sidecar parser
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run names -- -max_total_time=6600
          cargo +nightly fuzz run sidecar -- -max_total_time=6600
          cargo +nightly fuzz run bridge -- -max_total_time=6600

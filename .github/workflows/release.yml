# SPDX-License-Identifier: RPL-1.5
# Release (§15, P4 every OS/CPU): the owner pushes a tag vX.Y.Z; this builds GDM for six targets
#   Windows x64 + ARM64 (NSIS, ARM64 cross-compiled on the x64 runner), macOS Apple Silicon + Intel (.dmg; the
#   updater uses .app.tar.gz), Linux x64 + ARM64 (.deb, .rpm, .AppImage; the updater uses the AppImage),
# signs the updater artifacts with minisign (secret only in the "release" environment, reviewer = owner), writes
# ONE SIGNED latest.json naming every platform (U-01; each GDM checks its own key, update::platform_key, before
# Tauri's updater runs), attests build provenance, and creates a DRAFT GitHub release the owner publishes.
# Code signing: Windows Authenticode via SignPath when accepted (D8); macOS is ad-hoc signed until the owner
# decides on an Apple Developer ID (notarization, $99/year): until then macOS users allow it once in System Settings >
# Privacy & Security > Open Anyway (macOS 15 removed right-click > Open). Linux packages are unsigned (sha256 + attestation).
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: # started by version.yml on the tag it made (a tag pushed by its token starts nothing)
permissions: read-all
env:
  RUST_VERSION: "1.97.1"
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-2025, target: x86_64-pc-windows-msvc, arch: windows-x64, bundles: nsis }
          - { os: windows-2025, target: aarch64-pc-windows-msvc, arch: windows-arm64, bundles: nsis }
          - { os: macos-15, target: aarch64-apple-darwin, arch: macos-arm64, bundles: "app,dmg" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, arch: macos-x64, bundles: "app,dmg" }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, arch: linux-x64, bundles: "deb,rpm,appimage" }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, arch: linux-arm64, bundles: "deb,rpm,appimage" }
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Linux build libraries (WebKitGTK 4.1, tray, D-Bus for the Secret Service)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf rpm
      - name: toolchain (ring needs clang for aarch64-pc-windows-msvc; the Windows image has LLVM)
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add ${{ matrix.target }}
      - name: version in the tag == version in the app
        run: | # the one version (tauri.conf.json has none)
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::release runs on a tag, not on $GITHUB_REF_NAME: press Run workflow on \"version\" instead (it makes the tag and starts this)"; exit 1; }
          [ "v$(node scripts/version.mjs)" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != app version v$(node scripts/version.mjs)"; exit 1; }
      # the updater key is NOT in this step: every dependency's build.rs runs here. Tauri builds without updater
      # artifacts; the "sign" step below makes them, the only step that sees the key.
      - name: build
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          cargo build -p gdm-bridge --release --locked --target ${{ matrix.target }}
          mkdir -p src-tauri/binaries
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/gdm-bridge$ext" "src-tauri/binaries/gdm-bridge-${{ matrix.target }}$ext"
          [ "$RUNNER_OS" = Windows ] && node scripts/nsis-khmer.mjs --target ${{ matrix.target }}
          pnpm ext
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      - name: collect (installers + the updater artifact, signed in the next step)
        run: |
          v="${GITHUB_REF_NAME#v}"; a="${{ matrix.arch }}"; b="target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          one() { ls $1 2>/dev/null | head -1; }
          case "$RUNNER_OS" in
            Windows)
              s=$(one "$b/nsis/*-setup.exe"); cp "$s" "out/GDM_${v}_$a-setup.exe"
              echo "GDM_${v}_$a-setup.exe" > out/updater-$a.txt
              # GDM Setup: the designed window people download; this exact NSIS installer is inside (the updater,
              # winget and the uninstaller keep using NSIS itself)
              GDM_SETUP_PAYLOAD="$(cygpath -w "$PWD/$s")" cargo build -p gdm-setup --release --locked --target ${{ matrix.target }}
              cp "target/${{ matrix.target }}/release/gdm-setup.exe" "out/GDM-Setup_${v}_$a.exe" ;;
            macOS)
              cp "$(one "$b/dmg/*.dmg")" "out/GDM_${v}_$a.dmg"
              app=$(ls -d $b/macos/*.app | head -1); tar -czf "out/GDM_${v}_$a.app.tar.gz" -C "$(dirname "$app")" "$(basename "$app")" # what Tauri's updater unpacks
              echo "GDM_${v}_$a.app.tar.gz" > out/updater-$a.txt ;;
            Linux)
              cp "$(one "$b/deb/*.deb")" "out/GDM_${v}_$a.deb"; cp "$(one "$b/rpm/*.rpm")" "out/GDM_${v}_$a.rpm"
              i=$(one "$b/appimage/*.AppImage"); cp "$i" "out/GDM_${v}_$a.AppImage"
              echo "GDM_${v}_$a.AppImage" > out/updater-$a.txt ;;
          esac
          if [ "$a" = windows-x64 ]; then
            # store packages: manifest.json at the zip root (both stores require it); no dev "key" (the stores assign the id)
            node -e "const f='extension/dist/chrome/manifest.json',fs=require('fs'),m=JSON.parse(fs.readFileSync(f));delete m.key;fs.writeFileSync(f,JSON.stringify(m,null,2))"
            pwsh -Command "Compress-Archive extension/dist/chrome/* out/gdm-extension-chrome-$v.zip; Compress-Archive extension/dist/firefox/* out/gdm-extension-firefox-$v.zip"
          fi
          ls -la out
      - name: no shipped .exe needs the Visual C++ runtime (a clean Windows has no VCRUNTIME140.dll; .cargo/config.toml)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "dumpbin not found" }
          $r = "target/${{ matrix.target }}/release"
          $files = @("$r/gdm.exe", "$r/gdm-bridge.exe", "$r/gdm-setup.exe")
          foreach ($f in $files) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw "missing $f" }
            $rep = (& $dumpbin /nologo /imports $f) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $f" }
            if ($rep -match '(?im)\b(vcruntime|msvcp|concrt)[^\s\\]*\.dll\b') { throw "$f imports $($Matches[0])" }
            "ok $f"
          }
      - name: sign the updater artifact (minisign; the only step with the key)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          f="out/$(cat out/updater-${{ matrix.arch }}.txt)"
          pnpm tauri signer sign --app-version "${GITHUB_REF_NAME#v}" "$f"
          test -s "$f.sig"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-2025
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: out-*
          path: out
          merge-multiple: true
      - name: every file the website's download buttons link to is here (gdm.goldeniq.app src/content/release.ts FILES)
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $want = @("GDM-Setup_${v}_windows-x64.exe", "GDM_${v}_windows-x64-setup.exe", "GDM-Setup_${v}_windows-arm64.exe", "GDM_${v}_windows-arm64-setup.exe",
                    "GDM_${v}_macos-arm64.dmg", "GDM_${v}_macos-x64.dmg",
                    "GDM_${v}_linux-x64.AppImage", "GDM_${v}_linux-x64.deb", "GDM_${v}_linux-x64.rpm",
                    "GDM_${v}_linux-arm64.AppImage", "GDM_${v}_linux-arm64.deb", "GDM_${v}_linux-arm64.rpm",
                    "gdm-extension-chrome-$v.zip", "gdm-extension-firefox-$v.zip")
          $missing = $want | Where-Object { -not (Test-Path "out/$_") -or (Get-Item "out/$_").Length -eq 0 }
          if ($missing) { throw "missing (a website button would be dead): $($missing -join ', ')" }
      - name: signed latest.json (U-01, one entry per platform) + sha256 sums
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"
          # Tauri's platform keys (update::platform_key) => the build that serves them
          $keys = [ordered]@{ 'windows-x86_64' = 'windows-x64'; 'windows-aarch64' = 'windows-arm64'; 'darwin-aarch64' = 'macos-arm64'; 'darwin-x86_64' = 'macos-x64'; 'linux-x86_64' = 'linux-x64'; 'linux-aarch64' = 'linux-arm64' }
          $platforms = [ordered]@{}
          foreach ($k in $keys.Keys) {
            $name = (Get-Content "out/updater-$($keys[$k]).txt" -Raw).Trim()
            if (-not (Test-Path "out/$name.sig")) { throw "missing $name.sig" }
            $platforms[$k] = @{ signature = (Get-Content "out/$name.sig" -Raw).Trim(); url = "$base/$name" }
          }
          Remove-Item out/updater-*.txt
          $notes = Get-Content docs/release/notes-$v.json -Raw | ConvertFrom-Json
          $m = [ordered]@{ version = $v; channel = $(if ($v -match '-') { 'beta' } else { 'stable' }); expires = [int][double]::Parse((Get-Date).AddDays(90).ToUniversalTime().Subtract([datetime]'1970-01-01').TotalSeconds); security = [bool]$notes.security; notes_km = $notes.km; notes_en = $notes.en; notes = $notes.en; pub_date = (Get-Date).ToUniversalTime().ToString('o'); platforms = $platforms }
          $m | ConvertTo-Json -Depth 5 -Compress | Set-Content -NoNewline -Encoding utf8NoBOM out/latest.json
          pnpm tauri signer sign out/latest.json
          # LF lines: with CRLF, `sha256sum -c` (Linux) and `shasum -c` (macOS) fail on every file (v1.0.0 draft, 2026-11-15)
          ((Get-ChildItem out -File | Where-Object Name -notmatch '\.sig$' | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }) -join "`n") + "`n" | Set-Content -NoNewline -Encoding utf8NoBOM out/SHA256SUMS.txt
      - name: the sums check out with sha256sum -c, as a Linux or macOS user runs it
        shell: bash
        run: cd out && sha256sum -c --strict --quiet SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: draft release (the owner publishes)
        env:
          GH_TOKEN: ${{ github.token }}
        # every release points back at the official website (its download page reads the latest release itself)
        run: |
          $notes = Get-Content "docs/release/notes-$($env:GITHUB_REF_NAME.TrimStart('v')).md" -Raw
          $notes.TrimEnd() + "`n`n---`n**Website / គេហទំព័រ:** https://gdm.goldeniq.app/download · SHA-256: ``SHA256SUMS.txt```n" | Set-Content -NoNewline -Encoding utf8NoBOM out-notes.md
          gh release create $env:GITHUB_REF_NAME out/* --draft --title "Galaxy Download Manager $env:GITHUB_REF_NAME" --notes-file out-notes.md

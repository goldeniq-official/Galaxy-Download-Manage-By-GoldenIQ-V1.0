# SPDX-License-Identifier: RPL-1.5
# The "new version" button (docs/release/README.md). The owner presses Run workflow in GitHub Actions; this picks
# the next number itself (Semantic Versioning 2.0.0, semver.org), so nobody edits versions by hand, and starts
# release.yml. The kind of change is written in docs/release/next.json ("kind"), next to the notes that describe it:
#   patch 1.0.0 -> 1.0.1  only fixes: no new feature, no new setting, nothing removed
#   minor 1.0.0 -> 1.1.0  new features or settings; old settings, downloads and extensions keep working
#   major 1.0.0 -> 2.0.0  breaks something: old settings/database/extension no longer work, or a supported OS is dropped
# Calm numbering on purpose:
#   - the number changes only here, never per commit, push or build (CI runs carry no number);
#   - the first press ships the version already in the repo (1.0.0, owner 2026-11-14) as it is;
#   - refused when nothing changed since the last release; a patch less than 2 days after the last release (unless
#     "security": true), a minor less than 14 days after, a major less than 90 days after.
name: version
on:
  workflow_dispatch:
permissions: read-all
concurrency: version
jobs:
  next:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pick the number, move the notes, commit, tag
        run: |
          set -euo pipefail
          git config user.name goldeniq-official
          git config user.email yr.goldeniq@gmail.com
          cur=$(node scripts/version.mjs)
          if ! git rev-parse -q --verify "refs/tags/v$cur" >/dev/null; then
            v=$cur # never released yet: ship it as it is
          else
            [ -n "$(git log "v$cur..HEAD" --oneline)" ] || { echo "::error::nothing new since v$cur"; exit 1; }
            for e in json md; do
              [ -f docs/release/next.$e ] || { echo "::error::write docs/release/next.$e (the notes of this release) first"; exit 1; }
            done
            BUMP=$(node -p 'require("./docs/release/next.json").kind')
            SEC=$(node -p 'require("./docs/release/next.json").security === true')
            case "$BUMP" in patch) min=2 ;; minor) min=14 ;; major) min=90 ;;
              *) echo "::error::docs/release/next.json needs \"kind\": patch, minor or major (got $BUMP)"; exit 1 ;; esac
            [ "$SEC" = true ] && [ "$BUMP" = patch ] && min=0
            age=$(( ($(date +%s) - $(git log -1 --format=%ct "v$cur")) / 86400 ))
            if [ "$age" -lt "$min" ]; then
              echo "::error::v$cur is only $age day(s) old; a $BUMP waits $min days (a security patch: none)"; exit 1
            fi
            v=$(node scripts/version.mjs "$BUMP")
            git mv docs/release/next.json "docs/release/notes-$v.json"
            git mv docs/release/next.md "docs/release/notes-$v.md"
            git add package.json Cargo.toml Cargo.lock
            git commit -q -m "release v$v"
          fi
          for e in json md; do [ -f "docs/release/notes-$v.$e" ] || { echo "::error::missing docs/release/notes-$v.$e"; exit 1; }; done
          git tag -a "v$v" -m "Galaxy Download Manager v$v"
          git push --atomic origin HEAD:main "v$v"
          echo "V=$v" >> "$GITHUB_ENV"
      - name: build and draft the release (release.yml on the new tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "v$V"

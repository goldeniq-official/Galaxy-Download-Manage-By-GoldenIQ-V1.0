[workspace]
resolver = "2"
members = ["crates/gdm-core", "crates/gdm-bridge", "crates/gdm-media", "crates/gdm-auth", "fixtures/hostile", "src-tauri"]
# the G2/G3 throwaway spikes keep their own lock files
exclude = ["spikes"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

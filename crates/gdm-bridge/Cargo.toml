# SPDX-License-Identifier: RPL-1.5
[package]
name = "gdm-bridge"
version = "0.9.0"
edition = "2021"
publish = false
authors = ["GoldenIQ"]
license = "RPL-1.5"
description = "Galaxy Download Manager native messaging host (stateless, no async runtime)"

[[bin]]
name = "gdm-bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_System_Registry",
]

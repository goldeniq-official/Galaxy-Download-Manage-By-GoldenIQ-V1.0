# SPDX-License-Identifier: RPL-1.5
[package]
name = "gdm-core"
version = "0.1.0"
edition = "2021"
publish = false
authors = ["GoldenIQ"]
license = "RPL-1.5"
description = "Galaxy Download Manager download core (Tauri-independent, ADR-1)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
futures-util = "0.3"
url = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
httpdate = "1"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_UI_Shell",
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_System_Kernel",
  "Win32_System_WindowsProgramming",
]

[dev-dependencies]
gdm-fixture = { path = "../../fixtures/hostile" }
rcgen = "0.14"
rusqlite = { version = "0.41", features = ["bundled"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

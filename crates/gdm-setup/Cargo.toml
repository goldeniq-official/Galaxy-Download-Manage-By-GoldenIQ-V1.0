# SPDX-License-Identifier: RPL-1.5
[package]
name = "gdm-setup"
version.workspace = true
edition = "2021"
publish = false
authors = ["GoldenIQ"]
license = "RPL-1.5"
description = "GDM Setup: GDM's own install window; the Tauri NSIS installer inside does the install"

[target.'cfg(windows)'.dependencies]
gdm-bridge = { path = "../gdm-bridge" }
serde_json = "1"
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

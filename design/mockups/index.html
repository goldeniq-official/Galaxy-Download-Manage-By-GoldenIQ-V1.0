<!doctype html>
<html lang="km" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDM mockups</title>
<link rel="stylesheet" href="../tokens.css">
<script src="icons.js"></script>
<style>
/* ---------- window + shell ---------- */
html, body { height: 100%; overflow: hidden; }
.win { height: 100vh; display: grid; grid-template-rows: 40px 1fr; background: var(--shell); }
.title { display: flex; align-items: center; gap: 10px; padding: 0 0 0 14px; }
.title img { width: 22px; height: 22px; }
.title b { font-weight: 700; color: var(--tx-1); font-size: 13px; }
.title .sp { flex: 1; }
.wbtn { width: 46px; height: 40px; display: grid; place-items: center; background: transparent; color: var(--tx-3); cursor: pointer; transition: background var(--motion-hover); }
.wbtn:hover { background: var(--chip); }
.wbtn.close:hover { background: #c42b1c; color: #fff; }
.body { display: grid; grid-template-columns: auto 1fr; min-height: 0; }
.ico { width: 18px; height: 18px; flex: none; fill: currentColor; }
.ico.lg { width: 22px; height: 22px; }

/* rail: 64 px icons (medium), 220 px with labels (wide >= 1180) */
.rail { width: 64px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.rail .grp { font-size: 11.5px; color: var(--tx-muted); padding: 10px 10px 4px; display: none; }
.nav { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: var(--r-md); background: transparent; color: var(--tx-muted); cursor: pointer; text-align: start; position: relative; transition: background var(--motion-hover), color var(--motion-hover); }
.nav:hover { background: var(--chip); color: var(--tx-1); }
.nav.is-selected { background: var(--accent-wash); color: var(--accent); }
.nav .lbl, .nav .n { display: none; }
.nav .n { margin-inline-start: auto; font-size: 11.5px; color: var(--tx-muted); }
@media (min-width: 1180px) {
  .rail { width: 220px; }
  .rail .grp { display: block; }
  .nav .lbl, .nav .n { display: block; }
  .nav .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}

/* sunken content column */
.main { background: var(--sunk); border-start-start-radius: var(--r-shell); box-shadow: var(--shadow-sunk); display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; position: relative; }
.top { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
.top h1 { font-size: 20px; font-weight: 700; color: var(--tx-1); margin: 0; flex: 1; white-space: nowrap; }
.search { display: flex; align-items: center; gap: 8px; width: 280px; min-height: 40px; padding: 0 12px; background: var(--field); border-radius: var(--r-md); color: var(--tx-muted); transition: background var(--motion-hover); }
.search:focus-within { background: var(--field-focus); color: var(--accent); }
.search input { background: transparent; flex: 1; min-width: 0; caret-color: var(--accent); color: var(--tx-1); line-height: 1.6; padding: 6px 0; }
.search input::placeholder { color: var(--tx-ph); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 6px 16px; border-radius: var(--r-md); cursor: pointer; white-space: nowrap; transition: background var(--motion-hover), transform var(--motion-press); line-height: 1.5; }
.btn-p { background: var(--accent-grad); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
html:lang(km) .btn-p { font-size: 13px; font-weight: 600; }
.btn-p:hover { background: var(--accent-grad-hover); }
.btn-p:active { transform: scale(.97); }
.btn-s { background: var(--chip); color: var(--tx-1); font-weight: 600; }
.btn-s:hover { background: var(--chip-hover); }
.btn-g { background: transparent; color: var(--tx-3); font-weight: 600; }
.btn-g:hover { background: var(--chip); }
.chip { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); color: var(--tx-3); cursor: pointer; transition: background var(--motion-hover); flex: none; }
.chip:hover { background: var(--chip-hover); color: var(--tx-1); }

/* list */
.list { overflow: auto; padding: 0 12px 8px 18px; scrollbar-gutter: stable; min-height: 0; scroll-padding-block: 40px 16px; }
.list::-webkit-scrollbar { width: 4px; } .list::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
.cols, .row { display: grid; grid-template-columns: 30px minmax(0,1.3fr) 76px minmax(170px,1fr) 84px 64px; align-items: center; column-gap: 12px; padding: 0 12px; }
.cols { font-size: 11.5px; color: var(--tx-muted); height: 32px; position: sticky; top: 0; background: var(--sunk); z-index: var(--z-sticky); }
.cols span:nth-child(n+3), .row > :nth-child(n+3) { text-align: end; }
.cols span:nth-child(4), .row > :nth-child(4) { text-align: start; }
.row { min-height: 56px; border-radius: var(--r-md); background: var(--row); margin-bottom: 6px; cursor: default; position: relative; color: var(--tx-2); transition: background var(--motion-hover); }
.row:hover { background: var(--row-hover); }
.row.is-selected { background: linear-gradient(90deg, var(--accent-wash), transparent 85%), var(--row); }
.row.is-selected::before { content: ""; position: absolute; inset-block: 10px; inset-inline-start: 0; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent-grad); }
.ft { width: 30px; height: 30px; border-radius: var(--r-sm); display: grid; place-items: center; }
.ft.zip { background: rgba(245,158,11,.16); color: #f5a524; } .ft.vid { background: rgba(139,92,246,.18); color: #a78bfa; }
.ft.aud { background: rgba(56,189,248,.16); color: #38bdf8; } .ft.doc { background: rgba(61,155,255,.16); color: var(--accent); }
.ft.app { background: rgba(124,196,20,.16); color: #8fd11c; }
:root[data-theme="light"] .ft.zip { color: #a35a00; } :root[data-theme="light"] .ft.vid { color: #6d3fd6; } :root[data-theme="light"] .ft.aud { color: #0369a1; } :root[data-theme="light"] .ft.app { color: #3f7a0b; }
.nm { min-width: 0; padding: 7px 0; }
.nm b { display: block; font-weight: 600; color: var(--tx-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm small { display: flex; align-items: center; font-size: 11.5px; color: var(--tx-muted); min-width: 0; }
.nm small .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ext { flex: none; }
/* single-line clipped text: stacked Khmer subscripts (្ត្រ, ្ដ) need ~.2em below the line box */
.clip1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .lbl, .st .tx, .nm b, .nm small .sub, .clip1 { padding-block: .2em; }
.ext { font-family: var(--f-mono), var(--f-khmer), monospace; font-size: 10.5px; background: var(--chip); color: var(--tx-3); padding: 0 6px; border-radius: 6px; margin-inline-start: 6px; }
.st { font-size: 12px; min-width: 0; padding: 6px 0; }
.st .tx { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st.warn .tx { color: var(--warn); } .st.err .tx { color: var(--err); } .st.done .tx { color: var(--done); }
.bar { height: 4px; border-radius: var(--r-pill); background: var(--track); overflow: hidden; margin-top: 5px; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent-grad); background-size: 200px 100%; }
.bar.warn > i { background: var(--warn-grad); } .bar.done > i { background: var(--done); }
.num { font-family: var(--f-mono), var(--f-khmer), monospace; font-size: 12px; color: var(--tx-3); white-space: nowrap; }
.act { font-size: 12px; color: var(--accent); background: transparent; padding: 2px 8px; border-radius: var(--r-sm); cursor: pointer; font-weight: 600; margin-inline-start: -8px; }
.act:hover { background: var(--accent-wash); }

.foot { display: flex; align-items: center; gap: 14px; padding: 8px 18px 10px; font-size: 12px; color: var(--tx-muted); }
.foot .sp { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--r-pill); background: var(--chip); color: var(--tx-3); cursor: pointer; white-space: nowrap; }
.pill:hover { background: var(--chip-hover); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--done); }

/* details pane (wide) */
.split .cols, .split .row { grid-template-columns: 30px minmax(0,1.4fr) 70px minmax(150px,1fr); }
.split .cols > :nth-child(n+5), .split .row > :nth-child(n+5) { display: none; }  /* speed + time left live in the pane */
.split { display: grid; grid-template-columns: minmax(0,1fr) 340px; min-height: 0; }
.pane { padding: 4px 18px 16px 6px; overflow: auto; min-height: 0; }
.card { background: linear-gradient(180deg, var(--card-a), var(--card-b)); border-radius: var(--r-xl); box-shadow: var(--shadow-card); padding: 16px; }
.pane h2 { font-size: 14px; font-weight: 700; color: var(--tx-1); margin: 0 0 2px; overflow-wrap: anywhere; }
.pane .sub { font-size: 11.5px; color: var(--tx-muted); }
.big { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 6px; }
.big b { font-size: 26px; font-weight: 700; color: var(--tx-1); font-family: var(--f-latin); }
.seg { display: flex; gap: 1px; height: 10px; border-radius: 6px; overflow: hidden; margin: 10px 0 4px; background: var(--card-b); }
.seg > i { flex: 1; background: var(--seg-idle); }
.seg > i.got { background: var(--accent); opacity: .6; } .seg > i.on { background: var(--accent); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin-top: 14px; font-size: 12px; }
.kv dt { color: var(--tx-muted); white-space: nowrap; } .kv dd { margin: 0; color: var(--tx-2); text-align: end; min-width: 0; }
.step { display: inline-flex; align-items: center; gap: 4px; }
.step button { width: 26px; height: 26px; border-radius: var(--r-sm); background: var(--chip); color: var(--tx-2); cursor: pointer; display: grid; place-items: center; }
.step button:hover { background: var(--chip-hover); }
.url { font-family: var(--f-mono), var(--f-khmer), monospace; font-size: 11.5px; color: var(--tx-3); background: var(--field); border-radius: var(--r-sm); padding: 8px 10px; overflow-wrap: anywhere; margin-top: 6px; }
.lab { font-size: 11.5px; color: var(--tx-muted); margin-top: 14px; display: block; }
.row-btns { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

/* modal */
.scrim { position: absolute; inset: 0; background: var(--scrim); backdrop-filter: blur(10px); display: grid; place-items: center; z-index: var(--z-modal); }
.modal { width: 560px; background: var(--glass-card); backdrop-filter: var(--blur-card); border-radius: var(--r-xl); box-shadow: var(--shadow-modal); padding: 20px 22px; }
.modal h2 { margin: 0; font-size: 18px; font-weight: 700; color: var(--tx-1); }
.note { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--tx-3); margin: 8px 0 4px; }
.note .ico { color: var(--accent); width: 16px; height: 16px; }
.fld { display: block; margin-top: 12px; }
.fld > span { display: block; font-size: 12px; font-weight: 600; color: var(--tx-3); margin-bottom: 4px; transition: color var(--motion-hover); }
.fld:focus-within > span { color: var(--accent); }
.in { display: flex; align-items: center; gap: 8px; min-height: 40px; background: var(--field); border-radius: var(--r-md); padding: 0 6px 0 12px; transition: background var(--motion-hover); }
.fld:focus-within .in { background: var(--field-focus); }
.in input { flex: 1; min-width: 0; background: transparent; color: var(--tx-1); caret-color: var(--accent); padding: 7px 0; line-height: 1.6; }
.in .mono { color: var(--tx-3); }
.two { display: grid; grid-template-columns: 180px 1fr; gap: 12px; }
.sel { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; width: 100%; background: var(--field); border-radius: var(--r-md); padding: 0 12px; cursor: pointer; color: var(--tx-1); }
.sel:hover { background: var(--field-focus); }
.mini { width: 30px; height: 30px; border-radius: var(--r-sm); background: var(--chip); color: var(--tx-2); display: grid; place-items: center; cursor: pointer; flex: none; }
.mini:hover { background: var(--chip-hover); }
.check { display: flex; align-items: center; gap: 10px; margin-top: 12px; background: transparent; cursor: pointer; padding: 4px 8px 4px 4px; border-radius: var(--r-sm); color: var(--tx-3); text-align: start; }
.check i { width: 18px; height: 18px; border-radius: 5px; background: var(--track); display: grid; place-items: center; flex: none; }
.check[aria-checked="true"] i { background: var(--accent-grad); color: #fff; }
.check:hover { background: var(--chip); }
.mfoot { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
.mfoot .sp { flex: 1; }
.meta { font-size: 12px; color: var(--tx-muted); }

/* settings */
.set { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }
.set .rail { width: 220px; }
.set .nav .lbl { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set .main { grid-template-rows: auto 1fr; }
.sbody { overflow: auto; padding: 0 18px 18px; min-height: 0; scroll-padding-block: 24px; }  /* focus never lands flush with the window edge */
.sec { margin-bottom: 14px; }
.sec h3 { font-size: 11.5px; font-weight: 600; color: var(--tx-muted); margin: 6px 4px 8px; }
.opt { display: flex; align-items: center; gap: 16px; padding: 12px 16px; min-height: 60px; }
.opt + .opt { margin-top: 2px; }
.opt .t { flex: 1; min-width: 0; }
.opt .t b { display: block; font-weight: 600; color: var(--tx-1); }
.opt .t small { display: block; font-size: 11.5px; color: var(--tx-muted); }
.card.list-card { padding: 4px 0; }
.toggle { width: 40px; height: 24px; border-radius: var(--r-pill); background: var(--track); position: relative; cursor: pointer; flex: none; transition: background var(--motion-quick); }
.toggle::after { content: ""; position: absolute; top: 4px; inset-inline-start: 4px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform var(--motion-quick) var(--ease-out); }
:root[data-theme="light"] .toggle::after { background: #ffffff; }
:root[data-theme="light"] .toggle[aria-checked="false"]::after { background: #5b6478; }
.toggle[aria-checked="true"] { background: var(--accent-grad); }
.toggle[aria-checked="true"]::after { transform: translateX(16px); }
html[dir="rtl"] .toggle[aria-checked="true"]::after { transform: translateX(-16px); }
.toggle.fx:focus-visible::after { background: var(--on-focus-strong); }
.tabs { display: inline-flex; background: var(--chip); border-radius: var(--r-pill); padding: 3px; gap: 2px; flex: none; }
.tab { padding: 4px 14px; border-radius: var(--r-pill); background: transparent; cursor: pointer; color: var(--tx-3); font-weight: 600; white-space: nowrap; line-height: 1.6; }
.tab:hover { color: var(--tx-1); }
.tab[aria-selected="true"] { background: var(--accent-grad); color: #fff; }
.in.short { width: 260px; flex: none; }

/* onboarding */
.ob { display: grid; place-items: center; background: var(--sunk); border-start-start-radius: var(--r-shell); box-shadow: var(--shadow-sunk); padding: 20px; }
.ob .card { width: 620px; padding: 26px 28px 22px; }
.dots { display: flex; gap: 6px; align-items: center; }
.dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--track); }
.dots i.on { width: 26px; background: var(--accent-grad); } .dots i.past { background: var(--accent); }
.ob h2 { font-size: 20px; font-weight: 700; color: var(--tx-1); margin: 14px 0 4px; }
.ob p { margin: 0 0 14px; color: var(--tx-3); }
.brow { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: var(--r-md); background: var(--row); margin-top: 6px; min-height: 58px; }
.brow .t { flex: 1; min-width: 0; } .brow .t b { display: block; color: var(--tx-1); font-weight: 600; } .brow .t small { color: var(--tx-muted); font-size: 11.5px; }
.ok { display: inline-flex; align-items: center; gap: 6px; color: var(--done); font-weight: 600; white-space: nowrap; }
.tip { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 10px 12px; border-radius: var(--r-md); background: var(--accent-wash); color: var(--tx-2); font-size: 12px; }
.tip .ico { color: var(--accent); margin-top: 2px; }
kbd { font-family: var(--f-mono), var(--f-khmer), monospace; font-size: 11px; background: var(--chip); padding: 1px 6px; border-radius: 5px; color: var(--tx-1); }
</style>
</head>

<div id="app"></div>

 km: {

  hSpeed:"ល្បឿន", tlimit:"កំណត់ល្បឿនសរុប", tlimitS:"សម្រាប់ hotspot ដែលមានកម្រិត data",

  bConn:"បានភ្ជាប់", bInstall:"ដំឡើង extension", bVer:"កំណែ", tipText:"<kbd>Ctrl</kbd> + ចុច = បង្ខំឱ្យ GDM ទាញ · <kbd>Alt</kbd> + ចុច = ទុកឱ្យ browser ទាញ។ អាចប្ដូរគ្រាប់ចុចក្នុងការកំណត់។", skip:"រំលង", back:"ថយក្រោយ", next:"បន្ទាប់",

const ic = (n, cls = "") => `<svg class="ico ${cls}" viewBox="0 0 256 256" aria-hidden="true">${PH[n]}</svg>`;
const B = (cls, inner, label) => `<button class="fx ${cls}"${label ? ` aria-label="${label}"` : ""}>${inner}</button>`;

const titlebar = () => `<header class="title"><img src="../../logo/gdm-icon-256.png" alt=""><b>Galaxy Download Manager</b><span class="sp"></span>
  ${B("wbtn", ic("minus"), S.min)}${B("wbtn", ic("square"), S.max)}${B("wbtn close", ic("x"), S.close)}</header>`;

const navs = (sel) => [["list-bullets","all",7],["download-simple","active",2],["check-circle","done",1],["queue","queue",2],null,["file-zip","zip",0],["file-video","video",1],["file-audio","music",1],["file-doc","docs",1],["app-window","apps",3],"gap",["gear-six","settings"]]
  .map(n => n === "gap" ? `<div style="flex:1"></div>` : n === null ? `<div class="grp">${S.cats}</div>` :
    `<button class="fx nav${n[1]===sel?" is-selected":""}" aria-label="${S[n[1]]}">${ic(n[0] + (n[1]===sel?"#fill":""), "lg")}<span class="lbl">${S[n[1]]}</span>${n[2]!=null?`<span class="n">${n[2]}</span>`:""}</button>`).join("");

const ROWS = [
 {ft:"app", fi:"app-window", n:"ubuntu-24.04.3-desktop-amd64.iso", ext:"iso", sz:"5.9 GB", st:"dl", p:63, sp:"8.4 MB/s", left:"4:12", sub:"releases.ubuntu.com"},
 {ft:"vid", fi:"file-video", n:"វគ្គសិក្សា Python មេរៀនទី៣ - អថេរ និងប្រភេទទិន្នន័យ.mp4", ext:"mp4", sz:"1.2 GB", st:"dl", p:28, sp:"3.1 MB/s", left:"4:31", sub:"drive.example.edu.kh"},
 {ft:"app", fi:"app-window", n:"blender-4.5.2-windows-x64.msi", ext:"msi", sz:"380 MB", st:"pausedNet", p:41, sp:"—", left:"—", sub:"download.blender.org"},
 {ft:"doc", fi:"file-doc", n:"របាយការណ៍ប្រចាំត្រីមាសទី៣ ឆ្នាំ២០២៦.pdf", ext:"pdf", sz:"4.2 MB", st:"needLink", p:72, sp:"—", left:"—", sub:"portal.example.gov.kh"},
 {ft:"app", fi:"app-window", n:"setup-printer-driver.exe", ext:"html", sz:"—", st:"html", p:0, sp:"—", left:"—", sub:"support.example.com"},
 {ft:"app", fi:"app-window", n:"node-v24.11.0-x64.msi", ext:"msi", sz:"31 MB", st:"finished", p:100, sp:"—", left:"—", sub:"nodejs.org"},
 {ft:"aud", fi:"file-audio", n:"podcast-ep-112.mp3", ext:"mp3", sz:"58 MB", st:"queued", p:0, sp:"—", left:"—", sub:"cdn.example.fm"},
];
const statusCell = r => {
  if (r.st === "dl") return `<div class="st"><span class="tx">${S.dl} ${r.p}%</span><div class="bar"><i style="width:${r.p}%"></i></div></div>`;
  if (r.st === "pausedNet") return `<div class="st warn"><span class="tx" title="${S.pausedNet}">${S.pausedNet}</span><div class="bar warn"><i style="width:${r.p}%"></i></div></div>`;
  if (r.st === "needLink") return `<div class="st warn"><span class="tx" title="${S.needLink}">${S.needLink}</span>${B("act", S.refresh)}</div>`;
  if (r.st === "html") return `<div class="st err"><span class="tx" title="${S.html}">${S.html}</span>${B("act", S.openBrowser)}</div>`;
  if (r.st === "finished") return `<div class="st done"><span class="tx">${S.finished}</span>${B("act", S.openFolder)}</div>`;
  return `<div class="st"><span class="tx" title="${S.queued}">${S.queued}</span></div>`;
};
const list = (sel) => `<div class="list" role="grid" aria-label="${S.title}"><div class="cols" role="row"><span></span><span>${S.cName}</span><span>${S.cSize}</span><span>${S.cStatus}</span><span>${S.cSpeed}</span><span>${S.cLeft}</span></div>
  ${ROWS.map((r,i) => `<div class="row fx${i===sel?" is-selected":""}" role="row" tabindex="0" aria-selected="${i===sel}"><span class="ft ${r.ft}">${ic(r.fi)}</span>
   <div class="nm"><b title="${r.n}">${r.n}</b><small><span class="sub">${r.sub}</span><span class="ext">.${r.ext}</span></small></div><span class="num">${r.sz}</span>${statusCell(r)}<span class="num">${r.sp}</span><span class="num">${r.left}</span></div>`).join("")}</div>`;

const mainCol = (sel, extra = "") => `<section class="main"><div class="top"><h1>${S.title}</h1>
   <label class="search">${ic("magnifying-glass")}<input placeholder="${S.search}" aria-label="${S.search}"></label>
   ${B("chip", ic("pause"), S.pauseAll)}${B("btn btn-p fx-strong", ic("plus") + S.add)}</div>
  ${extra || list(sel)}
  <div class="foot"><span>${S.items}</span><span class="sp"></span><span>${S.total} <b class="num">11.5 MB/s</b></span>${B("pill", ic("gauge") + S.limit)}${B("pill", `<span class="dot"></span>${S.connected}`)}</div></section>`;

const detailsPane = () => `<aside class="pane"><div class="card"><h2>ubuntu-24.04.3-desktop-amd64.iso</h2><div class="sub">${S.from}</div>
  <div class="big"><b>63%</b><span class="num">3.7 / 5.9 GB</span></div><div class="bar"><i style="width:63%"></i></div>
  <div class="seg" title="${S.seg}">${"got got on got got on got got on got on got on idle on idle idle".split(" ").map(c=>`<i class="${c}"></i>`).join("")}</div>
  <div class="sub">${S.seg}</div>
  <dl class="kv"><dt>${S.speed}</dt><dd class="num">8.4 MB/s</dd><dt>${S.left}</dt><dd class="num">4:12</dd>
   <dt>${S.conns}</dt><dd><span class="step">${B("", ic("minus"), "−")}<b class="num">8</b>${B("", ic("plus"), "+")}</span></dd>
   <dt>${S.resume}</dt><dd>${S.resumeYes}</dd><dt>${S.folder}</dt><dd class="mono" style="font-size:11.5px">D:\\Downloads\\Programs</dd></dl>
  <span class="lab">${S.fUrl}</span><div class="url">https://releases.ubuntu.com/24.04.3/ubuntu-24.04.3-desktop-amd64.iso</div>
  <span class="lab">${S.sha}</span><div class="url" style="color:var(--tx-muted)">${S.shaWait}</div>
  <div class="row-btns">${B("btn btn-s", ic("pause") + S.pause)}${B("btn btn-g", ic("folder-open") + S.openFolder)}</div></div></aside>`;

const shell = (inner) => `<div class="win">${titlebar()}${inner}</div>`;

const screens = {
 main: () => shell(`<div class="body"><nav class="rail">${navs("all")}</nav>${mainCol(-1)}</div>`),
 details: () => shell(`<div class="body"><nav class="rail">${navs("all")}</nav><section class="main" style="grid-template-rows:auto 1fr auto">${mainCol(0).replace(/^<section class="main">|<\/section>$/g,"").replace(list(0), `<div class="split">${list(0)}${detailsPane()}</div>`)}</section></div>`),
 info: () => shell(`<div class="body"><nav class="rail">${navs("all")}</nav><section class="main" style="grid-template-rows:auto 1fr auto">${mainCol(-1).replace(/^<section class="main">|<\/section>$/g,"")}
  <div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">${S.diTitle}</h2><div class="note">${ic("info#fill")}${S.diNote}</div>
   <label class="fld"><span>${S.fUrl}</span><div class="in"><span class="mono clip1" title="https://releases.ubuntu.com/24.04.3/ubuntu-24.04.3-desktop-amd64.iso">https://releases.ubuntu.com/24.04.3/ubuntu-24.04.3-desktop-amd64.iso</span>${B("mini", ic("copy"), "copy")}</div></label>
   <label class="fld"><span>${S.fName}</span><div class="in"><input value="ubuntu-24.04.3-desktop-amd64.iso"><span class="meta" style="white-space:nowrap;padding-inline-end:6px">${S.diMeta}</span></div></label>
   <div class="two"><div class="fld"><span>${S.fCat}</span>${B("sel", `<span>${S.apps}</span>${ic("caret-down")}`)}</div>
    <label class="fld"><span>${S.fSave}</span><div class="in"><input value="D:\\Downloads\\Programs" class="mono"><button class="fx mini" aria-label="${S.folder}">${ic("folder")}</button></div></label></div>
   <button class="fx check" role="checkbox" aria-checked="true"><i>${ic("check")}</i>${S.remember}</button>
   <div class="mfoot"><span class="sp"></span>${B("btn btn-g", S.cancel)}${B("btn btn-s", S.later + ic("caret-down"))}${B("btn btn-p fx-strong", ic("download-simple") + S.start)}</div></div></div></section></div>`),
 settings: () => shell(`<div class="body set"><nav class="rail">${[["gear-six","sGeneral"],["download-simple","sDownloads"],["gauge","sSpeed"],["puzzle-piece","sBrowsers"],["arrow-clockwise","sUpdate"],["shield-check","sPrivacy"],["plugs-connected","sAdvanced"],["info","sAbout"]]
   .map((n,i)=>`<button class="fx nav${i?"":" is-selected"}">${ic(n[0]+(i?"":"#fill"),"lg")}<span class="lbl">${S[n[1]]}</span></button>`).join("")}</nav>
  <section class="main"><div class="top"><h1>${S.settings} · ${S.sGeneral}</h1></div><div class="sbody">
   <div class="sec"><h3>${S.hLook}</h3><div class="card list-card">
    <div class="opt"><div class="t"><b>${S.lang}</b><small>${S.langS}</small></div><div class="tabs" role="tablist"><button class="fx fx-strong tab" role="tab" aria-selected="${LANG==="km"}">ខ្មែរ</button><button class="fx fx-strong tab" role="tab" aria-selected="${LANG==="en"}">English</button></div></div>
    <div class="opt"><div class="t"><b>${S.theme}</b><small>${S.themeS}</small></div><div class="tabs" role="tablist"><button class="fx fx-strong tab" role="tab" aria-selected="false">${S.tSys}</button><button class="fx fx-strong tab" role="tab" aria-selected="${THEME==="light"}">${S.tLight}</button><button class="fx fx-strong tab" role="tab" aria-selected="${THEME==="dark"}">${S.tDark}</button></div></div>
    <div class="opt"><div class="t"><b>${S.digits}</b><small>${S.digitsS}</small></div><button class="fx fx-strong toggle" role="switch" aria-checked="false" aria-label="${S.digits}"></button></div>
    <div class="opt"><div class="t"><b>${S.motion}</b><small>${S.motionS}</small></div><button class="fx fx-strong toggle" role="switch" aria-checked="false" aria-label="${S.motion}"></button></div></div></div>
   <div class="sec"><h3>${S.hBeh}</h3><div class="card list-card">
    <div class="opt"><div class="t"><b>${S.startup}</b><small>${S.startupS}</small></div><button class="fx fx-strong toggle" role="switch" aria-checked="true" aria-label="${S.startup}"></button></div>
    <div class="opt"><div class="t"><b>${S.toast}</b><small>${S.toastS}</small></div><button class="fx fx-strong toggle" role="switch" aria-checked="true" aria-label="${S.toast}"></button></div>
    <div class="opt"><div class="t"><b>${S.dfolder}</b><small>${S.dfolderS}</small></div><label class="fld" style="margin:0"><div class="in short"><input class="mono" value="D:\\Downloads" aria-label="${S.dfolder}"><button class="fx mini" aria-label="${S.folder}">${ic("folder")}</button></div></label></div></div></div>
   <div class="sec"><h3>${S.hSpeed}</h3><div class="card list-card">
    <div class="opt"><div class="t"><b>${S.tlimit}</b><small>${S.tlimitS}</small></div><label class="fld" style="margin:0"><div class="in" style="width:130px"><input class="mono" value="2 MB/s" aria-label="${S.tlimit}"></div></label><button class="fx fx-strong toggle" role="switch" aria-checked="false" aria-label="${S.tlimit}"></button></div></div></div>
  </div></section></div>`),
 onboarding: () => shell(`<div class="ob"><div class="card"><div style="display:flex;align-items:center;gap:12px"><div class="dots"><i class="past"></i><i class="on"></i><i></i></div><span class="meta">${S.step}</span></div>
  <h2>${S.obTitle}</h2><p>${S.obText}</p>
  ${[["Google Chrome","148.0",1],["Microsoft Edge","148.0",0],["Mozilla Firefox","146.0",0]].map(b=>`<div class="brow"><span class="ft doc">${ic("browser")}</span><div class="t"><b>${b[0]}</b><small>${S.bVer} ${b[1]}</small></div>${b[2]?`<span class="ok">${ic("check-circle#fill")}${S.bConn}</span>`:B("btn btn-s", ic("puzzle-piece") + S.bInstall)}</div>`).join("")}
  <div class="tip">${ic("info#fill")}<span>${S.tipText}</span></div>
  <div class="mfoot">${B("btn btn-g", S.skip)}<span class="sp"></span>${B("btn btn-s", S.back)}${B("btn btn-p fx-strong", S.next + ic("arrow-right"))}</div></div></div>`),
};
document.getElementById("app").innerHTML = (screens[SCREEN] || screens.main)();
// a real modal traps focus: everything behind it is inert
if (SCREEN === "info") document.querySelectorAll(".title, .rail, .main > :not(.scrim)").forEach(e => e.inert = true);
</script>
</body>
</html>

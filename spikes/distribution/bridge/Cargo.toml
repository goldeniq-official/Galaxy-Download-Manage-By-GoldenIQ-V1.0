# SPIKE ONLY (G2) - throwaway, never shipped.
[package]
name = "gdm-bridge-spike"
version = "0.1.0"
edition = "2021"
publish = false
authors = ["GoldenIQ"]

[[bin]]
name = "gdm-bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
minisign = "0.7"
sha2 = "0.10"
ureq = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true

# SPDX-License-Identifier: RPL-1.5
[package]
name = "galaxy-download-manager"
version = "0.9.0"
description = "Galaxy Download Manager"
authors = ["GoldenIQ"]
license = "RPL-1.5"
edition = "2021"
publish = false

[lib]
name = "gdm_app"
crate-type = ["rlib"]

[[bin]]
name = "gdm"
path = "src/main.rs"

[features]
# MSIX / Microsoft Store build: the Store updates the app, the in-app updater is compiled out (§07)
store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gdm-core = { path = "../crates/gdm-core" }
gdm-bridge = { path = "../crates/gdm-bridge" }
gdm-auth = { path = "../crates/gdm-auth" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
minisign-verify = "0.2"
url = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
gdm-fixture = { path = "../fixtures/hostile" }

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell_Common",
  "Win32_System_Power",
  "Win32_System_Console",
  "Win32_Media_Audio",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_Networking_WinHttp",
  "Win32_Security_Credentials",
  "Win32_Security_Authentication_Identity",
  "Win32_System_LibraryLoader",
  "Foundation",
  "Networking_Connectivity",
]
